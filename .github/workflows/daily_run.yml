name: Daily Archival Run (WordPress News)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Crawl mode (baseline or incremental)'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - baseline
      dry_run:
        description: 'Dry run only (no HTTP requests)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# PERSISTENCE GATE: Scheduled daily crawl is intentionally NOT enabled.
# GitHub Actions runners are ephemeral — crawl results would be discarded
# at job end. Enable schedule only after a durable archive destination is
# configured (e.g., persistent storage volume, artifact repository, or
# external object store). See docs/phase8_daily_run.md for details.
#
# schedule:
#   - cron: '0 6 * * *'

jobs:
  daily-run:
    name: Run archival crawl (${{ github.event.inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate CLI (dry run)
        run: |
          python -m src.corpusai_run --portal wordpress-news --mode ${{ github.event.inputs.mode }} --dry-run

      - name: Execute archival run
        if: github.event.inputs.dry_run != 'true'
        run: |
          python -m src.corpusai_run --portal wordpress-news --mode ${{ github.event.inputs.mode }} --log-level INFO
        env:
          PYTHONUNBUFFERED: "1"

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpusai-run-logs-${{ github.run_id }}
          path: results/wordpress_validation/phase6b/runs/
          retention-days: 30
          if-no-files-found: warn

name: Offline Test Suite

on:
  push:
    branches: [ main, master, phase6-browser-replay, phase6b-incremental-crawling ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Offline Pytest Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Synthetic WARC Fixtures
        run: |
          python tests/fixtures/generate_warc_fixtures.py

      - name: Execute Offline Test Suite
        run: |
          pytest -v

name: Offline Test Suite

on:
  push:
    branches: [ main, master, phase6-browser-replay, phase6b-incremental-crawling ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Offline Pytest Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: |
          uv python install ${{ matrix.python-version }}

      - name: Install Dependencies from Lockfile
        run: |
          uv sync --locked --extra screenshots --extra test --python ${{ matrix.python-version }}

      - name: Generate Synthetic WARC Fixtures
        run: |
          uv run --python ${{ matrix.python-version }} python tests/fixtures/generate_warc_fixtures.py

      - name: Execute Offline Test Suite
        run: |
          uv run --python ${{ matrix.python-version }} pytest -v
